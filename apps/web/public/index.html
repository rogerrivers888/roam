<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <title>Roam</title>
    <!-- viewport-fit=cover + safe-area insets: the installed web app draws under the notch (research §2) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1.00001, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Roam" />
    <meta name="theme-color" content="#1F5F5B" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Chrome tab / bookmarks: .ico for older UAs, .svg for modern; 180px for the iOS home screen (docs/brand).
         Tab icons sit on brand red (the pack's app-icon alt) so they read on Chrome's dark tab strip; the ink square vanished into it. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; overflow: hidden; background: #F7F6F2; -webkit-text-size-adjust: 100%; }
      /* 100vh includes Safari's bar; fill-available does not */
      #root { min-height: 100vh; min-height: -webkit-fill-available; display: flex; }
    </style>
      <style>
      :root { --roam-bg: #F7F6F2; --roam-surface: #FFFFFF; --roam-ink: #1D1B16; color-scheme: light; }
      body { background: var(--roam-bg); }
      [data-theme="dark"] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.86) contrast(0.9); }
      [data-theme="dark"] .leaflet-container { background: #14130F; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
