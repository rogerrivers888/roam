<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <title>Roam</title>
    <!-- viewport-fit=cover + safe-area insets: the installed web app draws under the notch (research §2) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1.00001, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      `black-translucent` is what lets the app paint *under* the clock, the
      signal and the battery instead of iOS reserving a white strip above it
      (owner, 6 Sep 2026: "That should all be map, and that is achievable. You
      can see Airbnb do it").

      It applies to the whole app, so every screen that is not full-bleed adds
      `env(safe-area-inset-top)` back on for itself (App.tsx `Edges`) — the
      wordmark must not end up under the clock. It only takes effect in the
      installed app; in a browser tab the status bar belongs to the browser and
      nothing can be drawn under it.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Roam" />
    <meta name="theme-color" content="#B6E3CF" />
    <!-- Type from the style guide: Archivo for UI, Caveat for the wordmark only -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Caveat:wght@700&display=swap" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Chrome tab / bookmarks: .ico for older UAs, .svg for modern; 180px for the iOS home screen (docs/brand).
         Tab icons sit on brand red (the pack's app-icon alt) so they read on Chrome's dark tab strip; the ink square vanished into it. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; overflow: hidden; background: #FFFFFF; -webkit-text-size-adjust: 100%; }
      /* Archivo everywhere except the wordmark (Caveat) and the odd monospace value, which mark themselves with data-font */
      #root *:not(svg):not(svg *):not([data-font]) { font-family: Archivo, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      /* 100vh includes Safari's bar; fill-available does not */
      #root { min-height: 100vh; min-height: -webkit-fill-available; display: flex; }
    </style>
      <style>
      :root { --roam-bg: #FFFFFF; --roam-surface: #FFFFFF; --roam-ink: #201E1D; --roam-headerBg: #B6E3CF; color-scheme: light; }
      body { background: var(--roam-bg); }
      [data-theme="dark"] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.86) contrast(0.9); }
      [data-theme="dark"] .leaflet-container { background: #17171A; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!--
      The installed app has to open with no signal (owner, 4 Sep 2026: "sometimes,
      often, users will be offline or not have signal"). The worker caches the
      app itself; the household's data is kept separately in IndexedDB by
      src/offline/cache.ts, under the licence rules in src/offline/policy.ts.
      Registered after load so it never competes with the first paint.
    -->
    <script>
      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () { /* no offline shell; the app still works online */ });
        });
      }
    </script>
  </body>
</html>
