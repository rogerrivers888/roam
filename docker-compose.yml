services:
  postgres:
    image: postgres:17-alpine
    container_name: roam-postgres
    environment:
      POSTGRES_USER: roam
      POSTGRES_PASSWORD: roam
      POSTGRES_DB: roam
    ports:
      - "5434:5432"
    volumes:
      - roam-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roam -d roam"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  roam-pgdata:
